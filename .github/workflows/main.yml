name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Node paketlerini kur
        run: npm install

      - name: Capacitor araçlarını kur
        run: |
          npm install --save-dev @capacitor/assets
          npm install @capacitor/cli

      - name: Uygulamayı derle
        run: npm run build

      - name: Android ikonlarını oluştur
        run: |
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          else
            echo "assets/icon.png bulunamadı. Mevcut ikonlarla devam ediliyor."
          fi

      - name: Capacitor Android senkronizasyonu
        run: npx cap sync android

      - name: Eski Gradle Wrapper dosyalarını sil
        run: |
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          rm -f android/gradle/wrapper/gradle-wrapper.properties
          rm -f android/gradlew
          rm -f android/gradlew.bat

      - name: Gradle 8.14.3 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Temiz Gradle Wrapper oluştur
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Portfoy-Ziyaret-Plani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
